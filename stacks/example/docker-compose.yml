services:
  sandbox:
    restart: unless-stopped
    image: dhi.io/alpine-base:3.23@sha256:b9d3f74989db66757080994a59c89268bd2e72e83b5d4784969addec65ab3530
    command: ["sh", "-c", "while :; do sleep 3600; done"]
    volumes:
      - ${STACK_DIR}/bin:/usr/local/ai-cli-bin:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
      - seccomp:../../security/seccomp-default.json
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 64
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
